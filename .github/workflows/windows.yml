name: Windows validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      driver_tests:
        description: Run administrator WinDivert tests (isolated loopback only)
        type: boolean
        default: false
      legacy_global_tests:
        description: 'CONSENT: GLOBAL outbound pulses affect ALL traffic on this isolated runner (never a shared host)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: windows-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build application and tests
        shell: pwsh
        run: |
          dotnet build DarkDesync.Tests/DarkDesync.Tests.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build DarkDesync.UiTests/DarkDesync.UiTests.csproj -c Release --nologo
          exit $LASTEXITCODE
      - name: Dependency security gate
        shell: pwsh
        run: |
          $json = dotnet list DarkDesync.Tests/DarkDesync.Tests.csproj package --vulnerable --include-transitive --format json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $audit = ($json -join "`n") | ConvertFrom-Json
          if ($audit.problems.Count -gt 0) { throw "Dependency audit could not complete" }
          foreach ($project in $audit.projects) {
            foreach ($framework in $project.frameworks) {
              foreach ($package in @($framework.topLevelPackages) + @($framework.transitivePackages)) {
                if ($package.vulnerabilities.Count -gt 0) { throw "Vulnerable dependency: $($package.id)" }
              }
            }
          }
      - name: Unit and regression tests (no driver)
        run: dotnet test DarkDesync.Tests/DarkDesync.Tests.csproj -c Release --no-build --filter "Category!=Driver" --logger "trx;LogFileName=windows.trx" --results-directory artifacts/tests
      - name: WPF visual tree and bindings
        run: dotnet run --project DarkDesync.UiTests/DarkDesync.UiTests.csproj -c Release --no-build
      - name: Single Windows x64 download
        run: dotnet publish DarkDesync/DarkDesync.csproj -c Release -r win-x64 --self-contained false -o artifacts/DarkDesync-win-x64
      - name: Verify release payload and exact source commit
        shell: pwsh
        run: |
          foreach ($file in @('DarkDesync.exe', 'WinDivert.dll', 'WinDivert64.sys')) {
            $path = Join-Path artifacts/DarkDesync-win-x64 $file
            if (!(Test-Path $path) -or (Get-Item $path).Length -eq 0) { throw "Missing release file: $file" }
            Get-FileHash $path -Algorithm SHA256
          }
          Set-Content artifacts/DarkDesync-win-x64/SOURCE_COMMIT.txt $env:GITHUB_SHA
      - uses: actions/upload-artifact@v4
        with:
          name: DarkDesync-win-x64
          path: artifacts/DarkDesync-win-x64/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-results
          path: artifacts/tests/
          retention-days: 7
  driver-loopback:
    if: github.event_name == 'workflow_dispatch' && inputs.driver_tests
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      DARKDESYNC_DRIVER_TESTS: '1'
      DARKDESYNC_GLOBAL_TESTS: ${{ inputs.legacy_global_tests && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build test-only UDP child process (no second application)
        run: dotnet build DarkDesync.UiTests/DarkDesync.UiTests.csproj -c Release --nologo
      - name: Explicit driver tests (GLOBAL cases require separate consent; generated traffic is local)
        run: dotnet test DarkDesync.Tests/DarkDesync.Tests.csproj -c Release --filter "Category=Driver" --logger "trx;LogFileName=driver.trx" --results-directory artifacts/driver
      - name: Real WPF UI Automation START button with native WinDivert
        if: inputs.legacy_global_tests
        shell: pwsh
        run: |
          dotnet run --project DarkDesync.UiTests/DarkDesync.UiTests.csproj -c Release --no-build -- --driver-ui 2>&1 | Tee-Object -FilePath artifacts/driver/wpf-native-start.txt
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: driver-test-results
          path: artifacts/driver/
          retention-days: 7
